project:
  type: website
  resources:
    - astfalck_cv.pdf
    - "fonts/"
    # Static snapshots of retired sub-sites — copied through to docs/ on every
    # render so live URLs (/notes/, /writing*) keep working. Sources archived
    # in ~/Documents/Admin/website_archive/.
    - "notes/"
    - "writing/"
    - writing.html
  output-dir: docs

website:
  title: "Lachlan Astfalck"
  navbar:
    background: light
    foreground: dark
    search: false
    left:
      - text: "Home"
        href: index.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Software"
        href: software.qmd
      - text: "Presentations"
        href: presentations.qmd
  page-footer:
    left: "© 2026 Lachlan Astfalck. Unless stated otherwise, all text and images licensed CC-BY-NC 4.0."

format:
  html:
    theme: astfalck.scss
    css: fonts.css
    toc: false
    anchor-sections: false
    grid:
      body-width: 720px
