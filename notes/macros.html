<!-- macros.html -->
<!-- v3-first config (rmarkdown/bookdown default today) -->
<script>
  window.MathJax = window.MathJax || {};
  window.MathJax.tex = Object.assign({
    packages: {'[+]': ['base', 'ams']},
    macros: {
      R: '{\\mathbb{R}}',
      EE: '{\\mathbb{E}}',
      Var: ['\\operatorname{Var}', 1],         // use as \Var{X}
      argmin: '\\mathop{\\mathrm{arg\\,min}}',
      argmax: '\\mathop{\\mathrm{arg\\,max}}',
      inner: ['\\langle #1,\\, #2 \\rangle', 2] // \inner{x}{y}
    }
  }, window.MathJax.tex || {});
  </script>
  
  <!-- Fallback for MathJax v2 (some older gitbook templates) -->
  <script type="text/x-mathjax-config">
  if (window.MathJax && MathJax.Hub) {
    MathJax.Hub.Config({
      TeX: {
        extensions: ["AMSmath.js","AMSsymbols.js"],
        Macros: {
          P: "{\\mathrm{P}}",
          E: "{\\mathbb{E}}",
          Var: ["\\operatorname{Var}", 1],
          argmin: "\\mathop{\\mathrm{arg\\,min}}",
          argmax: "\\mathop{\\mathrm{arg\\,max}}",
          inner: ["\\langle #1,\\, #2 \\rangle", 2]
        }
      }
    });
  }
  </script>
